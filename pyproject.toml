[project]
name = "agentrewind"
version = "0.0.1"
requires-python = ">=3.9"
dependencies = ["typer", "rich"]

[project.optional-dependencies]
openai = ["openai"]
anthropic = ["anthropic"]
dev = ["pytest", "openai", "anthropic"]

[project.scripts]
agentrewind = "agentrewind.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
