[project]
name = "agentfork-cli"
version = "0.3.0"
description = "Fork your LLM agent at any step and sweep prompts, models or tool results to find what fixes it."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Bimal Kumal" }]
keywords = ["llm", "agents", "debugging", "replay", "testing", "openai", "anthropic", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Testing",
]
dependencies = ["typer", "rich"]

[project.optional-dependencies]
openai = ["openai"]
anthropic = ["anthropic"]
ui = ["fastapi", "uvicorn"]
dev = ["pytest", "openai", "anthropic", "fastapi", "uvicorn", "httpx", "langgraph", "langchain-openai"]

[project.urls]
Homepage = "https://github.com/bimal1023/agentfork"
Issues = "https://github.com/bimal1023/agentfork/issues"

[project.scripts]
agentfork = "agentfork.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["docs/", ".github/", "tests/agentfork/"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentfork"]
